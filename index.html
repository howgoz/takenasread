<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taken as Read</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .hero { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)), url('images/background.JPG'); background-size: cover; background-position: center; }
    .photo-grid img { transition: all 0.4s; }
    .photo-grid img:hover { transform: scale(1.04); }
    
    /* Lightbox */
    #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
    #lightbox img { max-width: 95%; max-height: 95vh; border: 8px solid white; }
    .close { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <!-- Navigation -->
  <nav class="fixed top-0 w-full bg-black/90 backdrop-blur-md z-50">
    <div class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-light tracking-widest">TAKEN AS READ</h1>
      <div class="space-x-8">
        <a href="#commercial" class="hover:text-amber-400">Commercial</a>
        <a href="#artistic" class="hover:text-amber-400">Artistic</a>
        <a href="#contact" class="hover:text-amber-400">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero h-screen flex items-center justify-center text-center">
    <div>
      <h2 class="text-5xl md:text-7xl font-light mb-4">Taken as Read</h2>
      <p class="text-xl text-zinc-300">Photography</p>
    </div>
  </section>

  <!-- Commercial Work -->
  <section id="commercial" class="max-w-6xl mx-auto px-6 py-20">
    <h2 class="text-4xl font-light mb-12 text-center">Commercial Work</h2>
    <div class="photo-grid grid grid-cols-1 md:grid-cols-3 gap-6" id="commercial-grid">
      <!-- 12 images will be added by JavaScript -->
    </div>
  </section>

  <!-- Artistic Work -->
  <section id="artistic" class="max-w-6xl mx-auto px-6 py-20 bg-zinc-900">
    <h2 class="text-4xl font-light mb-12 text-center">Artistic Work</h2>
    <div class="photo-grid grid grid-cols-1 md:grid-cols-3 gap-6" id="artistic-grid">
      <!-- 12 images will be added by JavaScript -->
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="max-w-6xl mx-auto px-6 py-20 text-center">
    <h2 class="text-4xl font-light mb-8">Get in Touch</h2>
    <p class="text-zinc-400 mb-8">Interested in working together?</p>
    <a href="mailto:housego@live.com" class="inline-block bg-white text-black px-8 py-4 rounded-full font-medium hover:bg-amber-400 transition">
      Send me an email
    </a>
    <p class="mt-10 text-zinc-500">housego@live.com</p>
  </section>

  <footer class="text-center py-10 text-zinc-500 text-sm">
    © Taken as Read Photography
  </footer>

  <!-- Lightbox -->
  <div id="lightbox">
    <span class="close" onclick="closeLightbox()">×</span>
    <img id="lightbox-image" src="" alt="">
  </div>

  <script>
    // Replace these with your actual filenames (12 each)
    const commercialPhotos = [
      "bdance5.jpg", "blackford.JPG", "Blackford_Pavilion_Pergola.JPG", "dance.jpg",
      "Fire_Hydrant_Three.JPG", "St_Roque.JPG", "wedding.JPG"
    ];

    const artisticPhotos = [
      "flowers (1).JPG", "flowers (2).JPG", "modern1 (1).jpg", "modern1 (2).JPG",
      "water (1).JPG", "water (2).JPG", "water (3).JPG", "water (4).JPG",
      "water (5).JPG"
    ];

     function createGallery(sectionId, photos, folder) {
      const container = document.getElementById(sectionId);
      photos.forEach(filename => {
        const img = document.createElement('img');
        img.src = `images/${folder}/${filename}`;
        img.className = "w-full aspect-square object-cover rounded cursor-pointer";
        img.alt = filename;
        img.onclick = () => openLightbox(`images/${folder}/${filename}`);
        container.appendChild(img);
      });
    }

    function openLightbox(src) {
      document.getElementById('lightbox-image').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    // Initialize both galleries
    createGallery('commercial-grid', commercialPhotos, "commercial");
    createGallery('artistic-grid', artisticPhotos, "artistic");
  </script>
