<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taken as Read — Photography</title>
  <meta name="description" content="Taken as Read Photography — commercial and artistic photography.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://howgoz.github.io/takenasread/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Taken as Read — Photography">
  <meta property="og:description" content="Taken as Read Photography — commercial and artistic photography.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:url" content="https://howgoz.github.io/takenasread/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="images/hero.jpg" as="image">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-ink text-paper">

  <!-- Navigation -->
  <nav id="site-nav" class="fixed top-0 w-full z-50 transition-colors duration-500 border-b border-white/0">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <a href="#top" class="brand text-xl tracking-widest2">TAKEN AS READ</a>

      <div class="hidden md:flex items-center space-x-10">
        <a href="#commercial" class="nav-link">Commercial</a>
        <a href="#artistic" class="nav-link">Artistic</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>

      <button id="menu-btn" class="md:hidden relative w-8 h-6" aria-label="Toggle menu" aria-expanded="false">
        <span class="hamburger-line line-1 absolute left-0 top-0 w-8 h-px bg-white"></span>
        <span class="hamburger-line line-2 absolute left-0 top-1/2 -translate-y-1/2 w-8 h-px bg-white"></span>
        <span class="hamburger-line line-3 absolute left-0 bottom-0 w-8 h-px bg-white"></span>
      </button>
    </div>

    <div id="mobile-menu" class="nav-links md:hidden">
      <a href="#commercial" class="text-xl tracking-wide">Commercial</a>
      <a href="#artistic" class="text-xl tracking-wide">Artistic</a>
      <a href="#contact" class="text-xl tracking-wide">Contact</a>
    </div>
  </nav>

  <!-- Hero -->
  <section id="top" class="relative h-screen flex items-center justify-center text-center overflow-hidden">
    <img src="images/hero.jpg" alt="" class="hero-media absolute inset-0 w-full h-full object-cover" fetchpriority="high">
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/55 to-black/80"></div>
    <div class="relative z-10 px-6">
      <h2 class="text-6xl md:text-8xl font-light mb-5 tracking-wide">Taken as Read</h2>
      <p class="text-lg md:text-xl text-zinc-300 tracking-[0.3em] uppercase">Photography</p>
    </div>
    <a href="#commercial" class="scroll-cue absolute bottom-10 left-1/2 -translate-x-1/2 z-10 text-zinc-300" aria-label="Scroll to work">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v14M6 12l6 6 6-6"/>
      </svg>
    </a>
  </section>

  <!-- Commercial Work -->
  <section id="commercial" class="max-w-6xl mx-auto px-6 py-24 md:py-32">
    <div class="reveal mb-14">
      <span class="section-kicker">Portfolio</span>
      <h2 class="section-heading">Commercial Work</h2>
    </div>
    <div class="masonry reveal-stagger columns-1 sm:columns-2 lg:columns-3" id="commercial-grid"></div>
  </section>

  <!-- Artistic Work -->
  <section id="artistic" class="bg-zinc-950/60 border-y border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-24 md:py-32">
      <div class="reveal mb-14">
        <span class="section-kicker">Portfolio</span>
        <h2 class="section-heading">Artistic Work</h2>
      </div>
      <div class="masonry reveal-stagger columns-1 sm:columns-2 lg:columns-3" id="artistic-grid"></div>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="max-w-3xl mx-auto px-6 py-24 md:py-32 text-center reveal">
    <span class="section-kicker">Say hello</span>
    <h2 class="section-heading mb-6">Get in Touch</h2>
    <p class="text-zinc-400 mb-10">Interested in working together?</p>
    <a href="mailto:takenasread@photographer.net" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 6 12 13 2 6"/>
        <path d="M2 6h20v12H2z"/>
      </svg>
      Send me an email
    </a>
    <p class="mt-8 text-zinc-500 tracking-wide">takenasread@photographer.net</p>
  </section>

  <footer class="text-center py-10 text-zinc-500 text-sm border-t border-white/5">
    © Taken as Read Photography
  </footer>

  <!-- Back to top -->
  <button id="back-to-top" class="lb-control fixed bottom-6 right-6 z-40 opacity-0" style="transform: translateY(12px);" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 z-[1000] hidden items-center justify-center">
    <button id="lightbox-close" class="lb-control absolute top-6 right-6" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button id="lightbox-prev" class="lb-control absolute left-4 md:left-8 top-1/2 -translate-y-1/2" aria-label="Previous image">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="lightbox-next" class="lb-control absolute right-4 md:right-8 top-1/2 -translate-y-1/2" aria-label="Next image">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <img id="lightbox-image" src="" alt="" class="max-w-[92%] max-h-[86vh] shadow-2xl">
    <div id="lightbox-counter" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-sm text-zinc-400 tracking-widest"></div>
  </div>

  <script src="js/main.js" defer></script>
</body>
</html>
